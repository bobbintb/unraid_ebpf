name: Check for new UnRaid version
on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'  # Runs once a day at 2 AM UTC

jobs:
  check-version:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Check for new UnRaid version
        id: check
        run: |
          echo "Fetching latest UnRaid version..."
          LATEST_VERSION=$(curl -s https://releases.unraid.net/usb-creator | jq -r '.os_list | max_by(.name | ltrimstr("Unraid ") | split(".") | map(tonumber)) | .name' | sed 's/^Unraid //')
          echo "Latest UnRaid version: $LATEST_VERSION"
          
          echo "Fetching latest release from GitHub..."
          LATEST_RELEASE=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/latest" | jq -r '.tag_name // "none"')
          echo "Latest GitHub release: $LATEST_RELEASE"
          
          if [ "$LATEST_VERSION" != "$LATEST_RELEASE" ]; then
            echo "New version found: $LATEST_VERSION (current: $LATEST_RELEASE)"
            echo "trigger_build=true" >> $GITHUB_ENV
          else
            echo "Already up to date: $LATEST_VERSION"
            echo "trigger_build=false" >> $GITHUB_ENV
          fi
      
      - name: Trigger build workflow
        if: env.trigger_build == 'true'
        uses: yakubique/trigger-github-workflow@v1
        with:
          repository: ${{ github.repository }}
          workflow: main.yml
          # token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: No new version
        if: env.trigger_build == 'false'
        run: |
          echo "No new UnRaid version detected. Repository is up to date."
