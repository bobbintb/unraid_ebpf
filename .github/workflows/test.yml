name: Check for new UnRaid version
on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  check-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Check for new UnRaid version
        id: check
        run: |
          echo "Fetching latest UnRaid version..."
          LATEST_VERSION=$(curl -s https://releases.unraid.net/usb-creator | jq -r '.os_list[0].name' | sed 's/^Unraid //')
          echo "Latest UnRaid version: $LATEST_VERSION"
          echo "latest_version=$LATEST_VERSION" >> $GITHUB_OUTPUT
          
          echo "Fetching latest release from GitHub..."
          LATEST_RELEASE=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/latest" | jq -r '.tag_name // "none"')
          echo "Latest GitHub release: $LATEST_RELEASE"
          echo "latest_release=$LATEST_RELEASE" >> $GITHUB_OUTPUT
          
          if [ "$LATEST_VERSION" != "$LATEST_RELEASE" ]; then
            echo "New version available: $LATEST_VERSION (current: $LATEST_RELEASE)"
            echo "new_version=true" >> $GITHUB_OUTPUT
          else
            echo "Already up to date: $LATEST_VERSION"
            echo "new_version=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Trigger build workflow
        if: steps.check.outputs.new_version == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            console.log('Triggering build workflow for version: ${{ steps.check.outputs.latest_version }}');
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'main.yml',
              ref: 'main'
            });
      
      - name: No new version
        if: steps.check.outputs.new_version == 'false'
        run: |
          echo "No new UnRaid version detected. Current version ${{ steps.check.outputs.latest_version }} is already built."
